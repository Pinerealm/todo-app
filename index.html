<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-labelledby="todo-title">
        <div class="card-header">
          <div>
            <p class="eyebrow">Daily planning</p>
            <h1 id="todo-title">Todo App</h1>
            <p class="subtitle">Add tasks, keep track of them, and remove what's done.</p>
          </div>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
          </button>
        </div>

        <div class="progress-section" id="progress-section" hidden>
          <div class="progress-meta">
            <span id="progress-label" class="progress-label">0 of 0 done</span>
            <span id="progress-pct" class="progress-pct">0%</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
            id="progress-bar-wrap"
          >
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">Todo item</label>
          <input id="todo-input" name="todo" type="text" placeholder="Add a new task…" />
          <button type="submit">
            <span class="btn-icon" aria-hidden="true">+</span>
            <span>Add</span>
          </button>
        </form>

        <div class="filter-bar" id="filter-bar" hidden>
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Done</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite" aria-relevant="additions removals"></ul>
      </section>
    </main>
  </body>
</html>
